<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskMate AI — Turn briefs into team plans</title>
  <style>
    :root{--blue:#0b57d0;--canvas:#f8faff;--surface:#fff;--muted:#5f6368;--shadow:0 1px 2px rgba(60,64,67,.15),0 2px 6px 2px rgba(60,64,67,.06)}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:#1f1f1f;font:15px/1.5 Arial,sans-serif}.shell{max-width:890px;margin:auto;padding:0 20px}header{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:700}.hero{text-align:center;padding:30px 0}.hero h1{font-size:42px;letter-spacing:-1px}.hero h1 span{color:var(--blue)}.card{background:var(--surface);border-radius:24px;padding:28px;box-shadow:var(--shadow);border:1px solid #e1e7f0}.upload-zone{border:2px dashed #aac7f5;border-radius:18px;padding:40px;text-align:center;cursor:pointer}.upload-zone:hover{background:#f0f6ff}.file-info{display:none;background:#edf5ff;padding:12px;border-radius:12px;margin:16px 0}.primary{background:var(--blue);color:#fff;border:0;padding:13px 30px;border-radius:99px;font-weight:700;cursor:pointer}.primary:disabled{opacity:0.5}.processing{display:none;text-align:center;padding:30px}.spinner{width:50px;height:50px;border:5px solid #d3e3fd;border-top-color:var(--blue);border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.dashboard{display:none;margin-top:30px}.task{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:12px;border:1px solid #edf0f3;border-radius:12px;margin-bottom:8px}.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}.high{background:#fce8e6;color:#b3261e}.medium{background:#fef7e0;color:#8d4e00}.low{background:#e6f4ea;color:#137333}.role{border-left:3px solid #8ab4f8;padding:6px 14px;margin-bottom:10px}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.week{background:#f8faff;padding:14px;border-radius:12px;border:1px solid #e5eaf1}.week ul{padding:0;list-style:none}.week li{padding:4px 0;border-top:1px solid #eee}.error{color:#b3261e;background:#fce8e6;padding:12px;border-radius:12px;display:none;margin:12px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#303030;color:#fff;padding:12px 20px;border-radius:10px;display:none;z-index:99}input[type="file"]{display:none}input[type="text"]{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin-bottom:16px;font-size:15px}
  </style>
</head>
<body>
<div class="shell">
  <header><span class="brand">TaskMate AI</span><span>⚡ Gemini</span></header>
  <section class="hero"><h1>Turn briefs into <span>plans.</span></h1><p style="color:var(--muted)">Upload any project brief. AI creates tasks, roles, timeline.</p></section>

  <div class="card">
    <h3>🔑 Gemini API Key</h3>
    <input type="text" id="apiKeyInput" placeholder="Paste your Gemini API key here">

    <h3>📄 Upload your brief</h3>
    <div class="upload-zone" id="dropZone"><strong>Drop your file here</strong><p style="color:var(--muted)">or click to browse</p><p style="font-size:12px;color:#999">PDF, PNG, JPG · Max 15 MB</p></div>
    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg">

    <div class="file-info" id="fileInfo"><span id="fileName"></span> <button onclick="clearFile()" style="background:none;border:0;font-size:20px;cursor:pointer">×</button></div>

    <div class="error" id="errorBox"></div>

    <button class="primary" id="generateBtn" disabled style="width:100%;margin-top:12px">🚀 Generate team plan</button>

    <div class="processing" id="processing"><div class="spinner"></div><h3>Analyzing...</h3><p id="statusText">Reading your brief</p></div>
  </div>

  <div class="dashboard" id="dashboard">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>📋 Your Plan</h2><button onclick="resetAll()" style="background:#e8f0fe;border:0;padding:8px 16px;border-radius:99px;cursor:pointer">+ New</button></div>
    <div id="summary" style="background:#e8f0fe;padding:16px;border-radius:16px;margin:12px 0"></div>
    <div id="tasks"></div>
    <div id="roles" style="margin:16px 0"></div>
    <div id="timeline"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let selectedFile = null;

function toast(msg) { const t=$('#toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',3000) }
function showError(msg) { const e=$('#errorBox'); e.textContent=msg; e.style.display='block' }
function hideError() { $('#errorBox').style.display='none' }

function setFile(file) {
  if (!file) return;
  if (!['application/pdf','image/png','image/jpeg'].includes(file.type)) {
    showError('Please upload PDF, PNG, or JPG');
    return;
  }
  if (file.size > 15*1024*1024) {
    showError('File must be under 15 MB');
    return;
  }
  selectedFile = file;
  $('#fileName').textContent = file.name + ' (' + (file.size/1024/1024).toFixed(1) + ' MB)';
  $('#fileInfo').style.display = 'flex';
  $('#dropZone').style.display = 'none';
  $('#generateBtn').disabled = false;
  hideError();
}

function clearFile() {
  selectedFile = null;
  $('#fileInput').value = '';
  $('#fileInfo').style.display = 'none';
  $('#dropZone').style.display = 'block';
  $('#generateBtn').disabled = true;
}

const dz = $('#dropZone');
dz.addEventListener('click', () => $('#fileInput').click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor = '#0b57d0'; });
dz.addEventListener('dragleave', () => dz.style.borderColor = '#aac7f5');
dz.addEventListener('drop', e => { e.preventDefault(); dz.style.borderColor = '#aac7f5'; setFile(e.dataTransfer.files[0]); });
$('#fileInput').addEventListener('change', e => setFile(e.target.files[0]));

function setLoading(on) {
  $('#processing').style.display = on ? 'block' : 'none';
  $('#generateBtn').style.display = on ? 'none' : 'block';
}

function render(data) {
  $('#dashboard').style.display = 'block';
  $('#summary').innerHTML = `<strong>${data.project_summary || 'Project plan ready'}</strong><br><small>${data.tasks?.length || 0} tasks · ${data.team_roles?.length || 0} roles</small>`;
  
  $('#tasks').innerHTML = '<h4>📌 Tasks</h4>' + (data.tasks || []).map((t,i) => `
    <div class="task"><span>${i+1}</span><span><strong>${t.name}</strong><br><small>${t.estimated_hours || '?'} hours</small></span><span class="badge ${t.priority || 'medium'}">${t.priority || 'medium'}</span></div>
  `).join('') || '<p>No tasks</p>';

  $('#roles').innerHTML = '<h4>👥 Team Roles</h4>' + (data.team_roles || []).map(r => `
    <div class="role"><strong>${r.role}</strong><br><small>${(r.tasks || []).join(' · ')}</small></div>
  `).join('') || '<p>No roles</p>';

  const tl = data.timeline || {};
  $('#timeline').innerHTML = '<h4>📅 Timeline</h4><div class="timeline">' + Object.entries(tl).map(([week, items]) => `
    <div class="week"><strong>${week}</strong><ul>${(items || []).map(i => `<li>${i}</li>`).join('')}</ul></div>
  `).join('') || '</div><p>No timeline</p>';
}

function resetAll() { clearFile(); $('#dashboard').style.display = 'none'; window.scrollTo({top:0}) }

// GENERATE - DIRECT GEMINI API CALL WITH LATEST MODEL
async function generate() {
  const apiKey = $('#apiKeyInput').value.trim();
  if (!apiKey) { showError('Please paste your Gemini API key first'); return; }
  if (!selectedFile) { showError('Please upload a project brief'); return; }
  hideError();
  setLoading(true);

  try {
    const reader = new FileReader();
    const base64 = await new Promise((resolve, reject) => {
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(selectedFile);
    });

    // USING gemini-3.5-flash (latest working model)
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: `Analyze this project brief. Break it into a complete team project plan. Return ONLY valid JSON with: { "project_summary": "brief summary", "tasks": [{"name": "task name", "estimated_hours": 2, "priority": "high|medium|low"}], "team_roles": [{"role": "role name", "tasks": ["task1", "task2"]}], "timeline": {"week1": ["Task A"], "week2": ["Task B"]} }` },
            { inlineData: { mimeType: selectedFile.type, data: base64 } }
          ]
        }],
        generationConfig: { responseMimeType: 'application/json', temperature: 0.35 }
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data?.error?.message || 'API error');

    const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('');
    if (!text) throw new Error('No response from Gemini');

    const clean = text.replace(/^```json\s*/i, '').replace(/```$/, '').trim();
    const parsed = JSON.parse(clean);
    render(parsed);
    toast('✅ Plan generated successfully!');
  } catch (err) {
    showError(err.message || 'Something went wrong. Check your API key and try again.');
  } finally {
    setLoading(false);
  }
}

$('#generateBtn').addEventListener('click', generate);

// Sample preview
document.querySelector('.card').insertAdjacentHTML('beforeend', 
  '<button onclick="render(sampleData)" style="background:none;color:#0b57d0;border:0;cursor:pointer;margin-top:12px;font-weight:600">🔍 Preview sample plan</button>'
);

const sampleData = {
  project_summary: "Create a sustainability campaign for college campus",
  tasks: [
    { name: "Research sustainability initiatives", estimated_hours: 4, priority: "high" },
    { name: "Design campaign posters", estimated_hours: 6, priority: "high" },
    { name: "Create social media content", estimated_hours: 5, priority: "medium" },
    { name: "Plan workshop events", estimated_hours: 3, priority: "medium" },
    { name: "Final presentation", estimated_hours: 2, priority: "low" }
  ],
  team_roles: [
    { role: "Project Lead", tasks: ["Research sustainability initiatives", "Final presentation"] },
    { role: "Designer", tasks: ["Design campaign posters", "Create social media content"] },
    { role: "Event Coordinator", tasks: ["Plan workshop events"] }
  ],
  timeline: {
    week1: ["Research sustainability initiatives", "Design campaign posters"],
    week2: ["Create social media content", "Plan workshop events"],
    week3: ["Final presentation"]
  }
};
</script>
</body>
</html>
